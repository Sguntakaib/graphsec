# Docker Compose for Security Modeling Platform - Development
version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: security-platform-mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: security_modeling_platform
    ports:
      - "27017:27017"
    volumes:
      - mongodb_dev_data:/data/db
    networks:
      - security-platform-dev-network

  # FastAPI Backend - Development with hot reload
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: security-platform-backend-dev
    restart: unless-stopped
    environment:
      - MONGO_URL=mongodb://mongodb:27017/security_modeling_platform
      - DB_NAME=security_modeling_platform
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
      - PYTHONPATH=/app
    ports:
      - "8001:8001"
    depends_on:
      - mongodb
    networks:
      - security-platform-dev-network
    volumes:
      - ./backend:/app
      - /app/__pycache__
    command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]

  # React Frontend - Development with hot reload
  frontend:
    image: node:18-alpine
    container_name: security-platform-frontend-dev
    restart: unless-stopped
    working_dir: /app
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8001
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=443
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - security-platform-dev-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "yarn install && yarn start"

volumes:
  mongodb_dev_data:
    driver: local

networks:
  security-platform-dev-network:
    driver: bridge