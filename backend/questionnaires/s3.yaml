    - id: "s3_encryption_in_transit"
      question: "Is encryption in transit enforced?"
      type: "single_choice"
      options: ["HTTPS only enforced", "HTTPS preferred", "HTTP allowed", "Unknown"]
      help_text: "Encryption in transit protects data during transmission."
      related_branch: "Encryption"
    - id: "s3_access_points"
      question: "Are S3 Access Points used for this bucket?"
      type: "single_choice"
      options: ["Multiple access points", "Single access point", "No access points", "Unknown"]
      help_text: "Access Points provide simplified access management for shared datasets."
      related_branch: "AccessControl"
    - id: "s3_multi_region_access_points"
      question: "Are Multi-Region Access Points configured?"
      type: "single_choice"
      options: ["Configured", "Not configured", "Not applicable", "Unknown"]
      help_text: "Multi-Region Access Points provide automatic failover capabilities."
      related_branch: "Backup"
    - id: "s3_batch_operations"
      question: "Are S3 Batch Operations used for security tasks?"
      type: "single_choice"
      options: ["Regular batch operations", "Occasional use", "Not used", "Unknown"]
      help_text: "Batch Operations can perform security tasks like encryption at scale."
      related_branch: "Encryption"

