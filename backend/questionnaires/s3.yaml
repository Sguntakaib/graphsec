    - id: "s3_website_configuration"
      question: "Is this bucket configured for static website hosting?"
      type: "single_choice"
      options: ["Website hosting enabled", "Redirect only", "Not a website", "Unknown"]
      help_text: "Website hosting configuration affects security and access controls."
