node_type: "Asset"
node_subtype: "S3"
category: "Data Storage"
description: "Amazon S3 Storage Bucket"
required_branches:
  - "Encryption"
  - "AccessControl"
  - "DataClassification"
  - "Backup"
  - "Monitoring"

questionnaires:
  basic:
    - id: "s3_bucket_versioning"
      question: "Is bucket versioning enabled?"
      type: "single_choice"
      options: ["Enabled", "Suspended", "Disabled", "Unknown"]
      help_text: "Versioning protects against accidental deletion and provides data recovery options."
      related_branch: "Backup"
    - id: "s3_public_access"
      question: "What is the public access configuration?"
      type: "single_choice"
      options: ["Block all public access", "Partial blocking", "Public read allowed", "Fully public", "Unknown"]
      help_text: "Public access settings determine if bucket contents can be accessed publicly."
      related_branch: "AccessControl"
    - id: "s3_encryption_at_rest"
      question: "What encryption is used for data at rest?"
      type: "single_choice"
      options: ["SSE-KMS (Customer Keys)", "SSE-KMS (AWS Keys)", "SSE-S3", "No encryption", "Unknown"]
      help_text: "Server-side encryption protects data stored in S3."
      related_branch: "Encryption"
    - id: "s3_access_logging"
      question: "Is server access logging enabled?"
      type: "boolean"
      help_text: "Access logging tracks all requests made to the bucket for security monitoring."
      related_branch: "Monitoring"
    - id: "s3_mfa_delete"
      question: "Is MFA Delete enabled for this bucket?"
      type: "single_choice"
      options: ["Enabled", "Disabled", "Not applicable", "Unknown"]
      help_text: "MFA Delete requires multi-factor authentication to delete objects or suspend versioning."
      related_branch: "AccessControl"

  advanced:
    - id: "s3_bucket_policy"
      question: "How restrictive is the bucket policy?"
      type: "single_choice"
      options: ["Least privilege", "Standard restrictions", "Basic restrictions", "No bucket policy", "Unknown"]
      help_text: "Bucket policies control access at the bucket and object level."
      related_branch: "AccessControl"
    - id: "s3_cors_configuration"
      question: "How is CORS configured for this bucket?"
      type: "single_choice"
      options: ["Specific origins only", "Wildcard with restrictions", "Fully open (*)", "CORS disabled", "Unknown"]
      help_text: "CORS configuration controls cross-origin web requests to the bucket."
      related_branch: "CORS"
    - id: "s3_lifecycle_management"
      question: "Is lifecycle management configured?"
      type: "single_choice"
      options: ["Comprehensive rules", "Basic transitions", "Expiration only", "No lifecycle rules", "Unknown"]
      help_text: "Lifecycle rules automatically manage object storage classes and retention."
      related_branch: "DataClassification"
    - id: "s3_object_lock"
      question: "Is S3 Object Lock enabled?"
      type: "single_choice"
      options: ["Enabled - Compliance mode", "Enabled - Governance mode", "Disabled", "Unknown"]
      help_text: "Object Lock prevents object deletion or modification for a specified period."
      related_branch: "Backup"
    - id: "s3_cloudtrail_integration"
      question: "Is CloudTrail logging S3 API calls?"
      type: "single_choice"
      options: ["All API calls logged", "Data events only", "Management events only", "No CloudTrail", "Unknown"]
      help_text: "CloudTrail provides audit logs for S3 API operations."
      related_branch: "Monitoring"
    - id: "s3_replication"
      question: "Is cross-region replication configured?"
      type: "single_choice"
      options: ["Cross-region replication", "Same-region replication", "No replication", "Unknown"]
      help_text: "Replication provides data durability and disaster recovery capabilities."
      related_branch: "Backup"
    - id: "s3_notification_configuration"
      question: "Are bucket notifications configured for security events?"
      type: "single_choice"
      options: ["Comprehensive notifications", "Basic events", "No notifications", "Unknown"]
      help_text: "Bucket notifications alert on security-relevant events like unauthorized access."
      related_branch: "Monitoring"
    - id: "s3_inventory_configuration"
      question: "Is S3 Inventory configured for this bucket?"
      type: "single_choice"
      options: ["Daily inventory", "Weekly inventory", "No inventory", "Unknown"]
      help_text: "S3 Inventory provides regular reports on object metadata and status."
      related_branch: "Monitoring"
    - id: "s3_analytics_configuration"
      question: "Is S3 Analytics configured?"
      type: "single_choice"
      options: ["Storage class analysis", "Basic analytics", "No analytics", "Unknown"]
      help_text: "S3 Analytics provides insights into storage usage patterns."
      related_branch: "Monitoring"
    - id: "s3_intelligent_tiering"
      question: "Is S3 Intelligent Tiering enabled?"
      type: "single_choice"
      options: ["Enabled with monitoring", "Enabled basic", "Disabled", "Unknown"]
      help_text: "Intelligent Tiering automatically moves objects between storage classes."
      related_branch: "DataClassification"
    - id: "s3_transfer_acceleration"
      question: "Is Transfer Acceleration enabled?"
      type: "single_choice"
      options: ["Enabled", "Disabled", "Not needed", "Unknown"]
      help_text: "Transfer Acceleration speeds up uploads using CloudFront edge locations."
      related_branch: "NetworkSecurity"
    - id: "s3_request_payer"
      question: "Who pays for S3 requests and data transfer?"
      type: "single_choice"
      options: ["Bucket owner", "Requester", "Mixed model", "Unknown"]
      help_text: "Request payer configuration affects cost allocation and access patterns."
