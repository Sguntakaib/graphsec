node_type: "Asset"
node_subtype: "RDS"
category: "Data Storage"
description: "Amazon RDS Database Instance"
required_branches:
  - "Database"
  - "Encryption"
  - "AccessControl"
  - "Backup"
  - "Monitoring"

questionnaires:
  basic:
    - id: "rds_engine_type"
      question: "What database engine is used?"
      type: "single_choice"
      options: ["PostgreSQL", "MySQL", "MariaDB", "Oracle", "SQL Server", "Aurora PostgreSQL", "Aurora MySQL"]
      help_text: "Different database engines have varying security features and vulnerabilities."
      related_branch: "Database"
    - id: "rds_encryption_at_rest"
      question: "Is encryption at rest enabled?"
      type: "single_choice"
      options: ["Yes - Customer managed keys", "Yes - AWS managed keys", "No encryption", "Unknown"]
      help_text: "Encryption at rest protects data stored in the database."
      related_branch: "Encryption"
    - id: "rds_public_accessibility"
      question: "Is the database publicly accessible?"
      type: "single_choice"
      options: ["No - Private subnet only", "Yes - With security groups", "Yes - Publicly accessible", "Unknown"]
      help_text: "Public accessibility increases attack surface and requires careful configuration."
      related_branch: "NetworkSecurity"
    - id: "rds_backup_retention"
      question: "What is the backup retention period?"
      type: "single_choice"
      options: ["30+ days", "7-30 days", "1-7 days", "No backups", "Unknown"]
      help_text: "Backup retention determines recovery options in case of data loss."
      related_branch: "Backup"
    - id: "rds_multi_az_deployment"
      question: "Is Multi-AZ deployment enabled?"
      type: "single_choice"
      options: ["Multi-AZ enabled", "Single AZ", "Unknown"]
      help_text: "Multi-AZ deployment provides high availability and automatic failover."
      related_branch: "Backup"

  advanced:
    - id: "rds_parameter_group_hardening"
      question: "Is the database parameter group hardened?"
      type: "single_choice"
      options: ["Custom hardened parameters", "Modified default parameters", "Default parameters", "Unknown"]
      help_text: "Parameter group hardening improves database security configuration."
      related_branch: "Database"
    - id: "rds_ssl_encryption"
      question: "Is SSL/TLS encryption enforced for connections?"
      type: "single_choice"
      options: ["SSL required", "SSL available", "No SSL enforcement", "Unknown"]
      help_text: "SSL/TLS encryption protects data in transit to and from the database."
      related_branch: "Encryption"
    - id: "rds_iam_database_authentication"
      question: "Is IAM database authentication enabled?"
      type: "single_choice"
      options: ["IAM authentication enabled", "Traditional authentication only", "Mixed authentication", "Unknown"]
      help_text: "IAM authentication eliminates the need for database passwords."
      related_branch: "IAM"
    - id: "rds_automated_backups"
      question: "Are automated backups configured optimally?"
      type: "single_choice"
      options: ["Optimal backup window", "Standard configuration", "Suboptimal timing", "Backups disabled", "Unknown"]
      help_text: "Proper backup configuration ensures minimal impact on performance."
      related_branch: "Backup"
    - id: "rds_performance_insights"
      question: "Is Performance Insights enabled?"
      type: "single_choice"
      options: ["Enabled with long retention", "Enabled with short retention", "Disabled", "Unknown"]
      help_text: "Performance Insights helps identify performance bottlenecks and security issues."
      related_branch: "Monitoring"
    - id: "rds_enhanced_monitoring"
      question: "Is Enhanced Monitoring enabled?"
      type: "single_choice"
      options: ["Enabled with detailed metrics", "Basic enhanced monitoring", "CloudWatch only", "No monitoring", "Unknown"]
      help_text: "Enhanced Monitoring provides OS-level metrics for security analysis."
      related_branch: "Monitoring"
    - id: "rds_log_exports"
      question: "Which logs are exported to CloudWatch?"
      type: "multiple_choice"
      options: ["Error logs", "General logs", "Slow query logs", "Audit logs", "None"]
      help_text: "Log exports enable centralized log analysis and security monitoring."
      related_branch: "Logging"
    - id: "rds_deletion_protection"
      question: "Is deletion protection enabled?"
      type: "single_choice"
      options: ["Enabled", "Disabled", "Unknown"]
      help_text: "Deletion protection prevents accidental database deletion."
      related_branch: "AccessControl"
    - id: "rds_minor_version_upgrades"
      question: "Are automatic minor version upgrades enabled?"
      type: "single_choice"
      options: ["Auto upgrades enabled", "Manual upgrades only", "No upgrades configured", "Unknown"]
      help_text: "Automatic upgrades ensure security patches are applied promptly."
      related_branch: "PatchManagement"
    - id: "rds_maintenance_window"
      question: "Is the maintenance window optimally configured?"
      type: "single_choice"
      options: ["Optimal low-traffic window", "Standard window", "Default window", "Unknown"]
      help_text: "Proper maintenance windows minimize impact of security updates."
      related_branch: "PatchManagement"
    - id: "rds_option_groups"
      question: "Are option groups configured for security?"
      type: "single_choice"
      options: ["Security-focused options", "Standard options", "Default options", "No option groups", "Unknown"]
      help_text: "Option groups can enhance database security features."
      related_branch: "Database"
    - id: "rds_subnet_groups"
      question: "How are DB subnet groups configured?"
      type: "single_choice"
      options: ["Private subnets only", "Mixed public/private", "Public subnets", "Unknown"]
      help_text: "Subnet group configuration affects network isolation and security."
      related_branch: "NetworkSecurity"
    - id: "rds_security_groups"
      question: "How restrictive are the security groups?"
      type: "single_choice"
      options: ["Least privilege access", "Standard restrictions", "Broad access", "Unknown"]
      help_text: "Security groups control network access to the database."
      related_branch: "Firewall"
    - id: "rds_read_replicas"
      question: "Are read replicas configured securely?"
      type: "single_choice"
      options: ["Encrypted replicas in private subnets", "Standard replica configuration", "No read replicas", "Unknown"]
      help_text: "Read replicas should maintain the same security posture as the primary database."
      related_branch: "Encryption"
    - id: "rds_cross_region_backups"
      question: "Are cross-region automated backups enabled?"
      type: "single_choice"
      options: ["Cross-region backups enabled", "Same-region backups only", "No automated backups", "Unknown"]
      help_text: "Cross-region backups provide disaster recovery capabilities."
      related_branch: "Backup"
    - id: "rds_snapshot_sharing"
      question: "How are database snapshots shared?"
      type: "single_choice"
      options: ["No sharing (private)", "Specific account sharing", "Public sharing", "Unknown"]
      help_text: "Snapshot sharing policies affect data confidentiality."
      related_branch: "AccessControl"
    - id: "rds_custom_endpoints"
      question: "Are custom endpoints used for security?"
      type: "single_choice"
      options: ["Security-focused endpoints", "Standard endpoints", "No custom endpoints", "Unknown"]
      help_text: "Custom endpoints can provide additional security controls."
      related_branch: "AccessControl"

