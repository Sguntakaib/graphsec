      question: "Is CloudTrail enabled across all AWS regions?"
      type: "single_choice"
      options: ["Yes - All Regions", "Yes - Selected Regions", "Single Region Only", "Not Enabled", "Unknown"]
      help_text: "Multi-region CloudTrail provides comprehensive audit coverage."
      related_branch: "AuditLogging"
