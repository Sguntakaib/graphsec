node_type: "Asset"
node_subtype: "VPC"
category: "Network Infrastructure" 
description: "Amazon Virtual Private Cloud"
required_branches:
  - "NetworkSecurity"
  - "NetworkSegmentation"
  - "Firewall"
  - "Monitoring"
  - "AccessControl"

questionnaires:
  basic:
    - id: "vpc_cidr_block"
      question: "What CIDR block size is used for this VPC?"
      type: "single_choice"
      options: ["/16 (65,536 IPs)", "/20 (4,096 IPs)", "/24 (256 IPs)", "/28 (16 IPs)", "Other", "Unknown"]
      help_text: "CIDR block size affects available IP addresses and network design flexibility."
      related_branch: "NetworkSecurity"
    - id: "vpc_public_subnets"
      question: "Are there public subnets in this VPC?"
      type: "single_choice"
      options: ["Yes - Multiple public subnets", "Yes - Single public subnet", "No public subnets", "Unknown"]
      help_text: "Public subnets increase attack surface and require careful security configuration."
      related_branch: "NetworkSegmentation"
    - id: "vpc_internet_gateway"
      question: "Is an Internet Gateway attached to this VPC?"
      type: "single_choice"
      options: ["Yes - IGW attached", "No - Private VPC", "Unknown"]
      help_text: "Internet Gateway enables internet connectivity but increases security considerations."
      related_branch: "NetworkSecurity"
    - id: "vpc_nat_gateway"
      question: "Are NAT Gateways configured for private subnets?"
      type: "single_choice"
      options: ["NAT Gateway in each AZ", "Single NAT Gateway", "NAT Instance", "No NAT configured", "Unknown"]
      help_text: "NAT configuration affects outbound internet access security for private resources."
      related_branch: "NetworkSecurity"
    - id: "vpc_dns_settings"
      question: "What DNS settings are configured?"
      type: "multiple_choice"
      options: ["DNS resolution enabled", "DNS hostnames enabled", "Custom DNS servers", "Default settings", "Unknown"]
      help_text: "DNS configuration affects name resolution and can impact security."
      related_branch: "NetworkSecurity"

  advanced:
    - id: "vpc_flow_logs"
      question: "Are VPC Flow Logs enabled?"
      type: "single_choice"
      options: ["All traffic logging", "Accepted traffic only", "Rejected traffic only", "Flow logs disabled", "Unknown"]
      help_text: "VPC Flow Logs provide network traffic visibility for security monitoring."
      related_branch: "Monitoring"
    - id: "vpc_network_acls"
      question: "How are Network ACLs configured?"
      type: "single_choice"
      options: ["Custom restrictive ACLs", "Modified default ACLs", "Default ACLs only", "Unknown"]
      help_text: "Network ACLs provide subnet-level firewall controls."
      related_branch: "Firewall"
    - id: "vpc_security_groups_strategy"
      question: "What security group strategy is implemented?"
      type: "single_choice"
      options: ["Least privilege per service", "Application-tier based", "Basic security groups", "Default security groups", "Unknown"]
      help_text: "Security group strategy determines instance-level access controls."
      related_branch: "Firewall"
    - id: "vpc_route_tables"
      question: "How are route tables configured for security?"
      type: "single_choice"
      options: ["Separate route tables per tier", "Custom routing rules", "Default route tables", "Unknown"]
      help_text: "Route table configuration affects traffic flow and network segmentation."
      related_branch: "NetworkSegmentation"
    - id: "vpc_endpoints"
      question: "Are VPC Endpoints configured for AWS services?"
      type: "single_choice"
      options: ["Multiple interface endpoints", "Gateway endpoints only", "No VPC endpoints", "Unknown"]
      help_text: "VPC Endpoints provide secure access to AWS services without internet routing."
      related_branch: "NetworkSecurity"
    - id: "vpc_peering"
      question: "Is VPC Peering configured with other VPCs?"
      type: "single_choice"
      options: ["Secure peering with access controls", "Standard VPC peering", "No VPC peering", "Unknown"]
      help_text: "VPC Peering enables network connectivity between VPCs and requires security considerations."
      related_branch: "NetworkSecurity"
    - id: "vpc_transit_gateway"
      question: "Is AWS Transit Gateway used for connectivity?"
      type: "single_choice"
      options: ["Transit Gateway with route tables", "Basic Transit Gateway", "No Transit Gateway", "Unknown"]
      help_text: "Transit Gateway centralizes network connectivity and enables advanced routing controls."
      related_branch: "NetworkSecurity"  
    - id: "vpc_direct_connect"
      question: "Is AWS Direct Connect used for on-premises connectivity?"
      type: "single_choice"
      options: ["Dedicated connection", "Hosted connection", "No Direct Connect", "Unknown"]
      help_text: "Direct Connect provides dedicated network connectivity with specific security considerations."
