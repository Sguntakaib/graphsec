dependencies:
  vpc_flow_logs_enabled: "Monitoring"
  vpc_nat_gateway: "NetworkSecurity"
  vpc_endpoints_enabled: "NetworkSecurity"

threat_intelligence:
  cve_count: 35
  recent_threats: ["Network Reconnaissance", "Lateral Movement", "DDoS Attacks"]
  attack_vectors: ["Network Scanning", "Traffic Interception", "Route Hijacking"]
  mitre_techniques: ["T1046", "T1040", "T1565", "T1021"]
  threat_actors: ["APT Groups", "Cybercriminals", "Nation State"]

risk_factors:
  public_subnets: 2.5
  open_security_groups: 3.5
  no_flow_logs: 2.0
  default_nacls: 1.5
  no_vpc_endpoints: 2.0