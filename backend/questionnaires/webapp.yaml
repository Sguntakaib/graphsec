questionnaires:
  basic:
    - id: "webapp_authentication_method"
      question: "What authentication method is implemented?"
      type: "single_choice"
      options: ["OAuth2/OIDC", "SAML", "Username/Password with MFA", "Username/Password only", "No Authentication", "Unknown"]
      option_descriptions:
        "OAuth2/OIDC": "Modern federated authentication using OAuth 2.0 or OpenID Connect, providing secure token-based authentication with third-party identity providers."
        "SAML": "Security Assertion Markup Language for enterprise single sign-on, commonly used in corporate environments for federated authentication."
        "Username/Password with MFA": "Traditional credentials enhanced with multi-factor authentication (SMS, TOTP, hardware tokens) for additional security."
        "Username/Password only": "Basic authentication using only username and password - vulnerable to credential-based attacks."
        "No Authentication": "Application does not require user authentication - publicly accessible or relies on external security controls."
        "Unknown": "Authentication method is unclear or not documented."
      help_text: "Strong authentication methods prevent unauthorized access to the web application."
      related_branch: "Authentication"
    - id: "webapp_input_validation"
      question: "How is input validation implemented?"
      type: "single_choice"
      options: ["Comprehensive server-side validation", "Basic validation", "Client-side only", "No validation", "Unknown"]
      option_descriptions:
        "Comprehensive server-side validation": "Robust validation on the server including type checking, length limits, format validation, sanitization, and protection against injection attacks."
        "Basic validation": "Simple server-side checks for required fields and basic format validation, but may miss advanced attack vectors."
        "Client-side only": "Validation performed only in the browser - easily bypassed by attackers and offers no real security protection."
        "No validation": "No input validation is performed, making the application highly vulnerable to injection attacks and data corruption."
        "Unknown": "Input validation approach is unclear or not documented."
      help_text: "Proper input validation prevents injection attacks and data corruption."
      related_branch: "InputValidation"
    - id: "webapp_https_enforcement"
      question: "Is HTTPS enforced?"
      type: "single_choice"
      options: ["HTTPS only (HSTS enabled)", "HTTPS preferred", "Mixed HTTP/HTTPS", "HTTP only", "Unknown"]
      option_descriptions:
        "HTTPS only (HSTS enabled)": "All connections forced to use HTTPS with HTTP Strict Transport Security headers, preventing downgrade attacks and ensuring encrypted communication."
        "HTTPS preferred": "HTTPS is available and recommended but HTTP connections may still be accepted - some risk of insecure connections."
        "Mixed HTTP/HTTPS": "Some parts of the application use HTTPS while others use HTTP - creates security vulnerabilities and user confusion."
        "HTTP only": "All communication is unencrypted - highly vulnerable to man-in-the-middle attacks and data interception."
        "Unknown": "HTTPS implementation status is unclear or not documented."
      help_text: "HTTPS encryption protects data in transit and prevents man-in-the-middle attacks."
      related_branch: "Encryption"
    - id: "webapp_database_connection"
      question: "Does this application connect to a database?"
      type: "boolean"
      help_text: "Database connections require input validation to prevent SQL injection attacks."
      related_branch: "Database"
      conditional_trigger: "Database"
    - id: "webapp_api_endpoints"
      question: "Does this web application expose API endpoints?"
      type: "boolean"
      help_text: "APIs can be attack vectors if not properly secured with authentication and input validation."
      related_branch: "API"
      conditional_trigger: "API"
    - id: "webapp_session_management"
      question: "How are user sessions managed?"
      type: "single_choice"
      options: ["Secure session management", "Standard sessions", "Basic sessions", "No session management", "Unknown"]
      option_descriptions:
        "Secure session management": "Implements HTTPS-only cookies, secure session IDs, session rotation, timeout controls, and protection against session hijacking and fixation attacks."
        "Standard sessions": "Basic session handling with standard security practices like secure cookies and reasonable timeouts, but may lack advanced protections."
        "Basic sessions": "Simple session implementation with minimal security features - vulnerable to common session-based attacks."
        "No session management": "Application does not maintain user sessions, requiring re-authentication for each request or operating statelessly."
        "Unknown": "Session management implementation is unclear or not documented."
      help_text: "Secure session management prevents session hijacking and fixation attacks."
      related_branch: "SessionManagement"
    - id: "webapp_error_handling"
      question: "How are application errors handled?"
      type: "single_choice"
      options: ["Secure error handling (no info disclosure)", "Generic error messages", "Detailed error messages", "No error handling", "Unknown"]
      option_descriptions:
        "Secure error handling (no info disclosure)": "Errors are logged securely on the server while users receive generic messages that don't reveal system details to potential attackers."
        "Generic error messages": "Users see basic error messages without sensitive details, but error handling may not be comprehensively implemented."
        "Detailed error messages": "Error messages include technical details, stack traces, or system information - provides useful information to attackers."
        "No error handling": "Errors are not properly handled, potentially causing system crashes or exposing sensitive debugging information."
        "Unknown": "Error handling approach is unclear or not documented."
      help_text: "Proper error handling prevents information disclosure to attackers."
      related_branch: "ErrorHandling"
    - id: "webapp_logging_monitoring"
      question: "What logging and monitoring is in place?"
      type: "single_choice"
      options: ["Comprehensive security logging", "Basic application logging", "Minimal logging", "No logging", "Unknown"]
      option_descriptions:
        "Comprehensive security logging": "Detailed logging of security events, authentication attempts, access patterns, errors, and potential threats with real-time monitoring and alerting."
        "Basic application logging": "Standard application logs capturing basic events and errors, but may lack security-focused monitoring and correlation."
        "Minimal logging": "Limited logging of only critical events - insufficient for security monitoring or incident investigation."
        "No logging": "No logging is implemented - creates blind spots for security monitoring and compliance requirements."
        "Unknown": "Logging and monitoring capabilities are unclear or not documented."
      help_text: "Security logging enables threat detection and incident response."
      related_branch: "Logging"
    - id: "webapp_data_encryption"
      question: "How is sensitive data encrypted?"
      type: "single_choice"
      options: ["Encryption at rest and in transit", "Encryption in transit only", "Basic encryption", "No encryption", "Unknown"]
      option_descriptions:
        "Encryption at rest and in transit": "Comprehensive encryption protecting data both when stored (databases, files) and when transmitted (HTTPS, API calls) using strong encryption standards."
        "Encryption in transit only": "Data is encrypted during transmission but stored in plaintext - vulnerable to data breaches if storage is compromised."
        "Basic encryption": "Some encryption is implemented but may use weak algorithms, poor key management, or incomplete coverage of sensitive data."
        "No encryption": "Sensitive data is stored and transmitted in plaintext - highly vulnerable to data breaches and interception."
        "Unknown": "Data encryption implementation is unclear or not documented."
      help_text: "Data encryption protects sensitive information from unauthorized access."
      related_branch: "Encryption"
    - id: "webapp_security_headers"
      question: "Are security headers implemented?"
      type: "single_choice"
      options: ["Comprehensive security headers", "Basic headers", "Minimal headers", "No security headers", "Unknown"]
      help_text: "Security headers provide protection against common web vulnerabilities."
      related_branch: "CSP"

