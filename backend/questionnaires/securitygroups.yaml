      question: "What principle is followed for security group rules?"
      type: "single_choice"
      options: ["Least Privilege (Minimal Access)", "Standard Ports Only", "Application Requirements", "Wide Open Access", "Unknown"]
      help_text: "Least privilege principle minimizes attack surface by allowing only necessary access."
      related_branch: "AccessControl"
