      question: "How are ingress rules configured?"
      type: "single_choice"
      options: ["Specific Source/Port Rules", "Port-Based Rules", "Source-Based Rules", "Broad Allow Rules", "Unknown"]
      help_text: "Specific ingress rules control inbound traffic to subnet resources."
      related_branch: "Firewall"
