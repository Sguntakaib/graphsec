questionnaires:
  basic:
    - id: "nacl_default_configuration"
      question: "How are default Network ACLs configured?"
      type: "single_choice"
      options: ["Custom Restrictive Rules", "Modified Default Rules", "Default AWS Configuration", "No Configuration", "Unknown"]
      help_text: "Custom NACLs provide better security control than default configurations."
      related_branch: "NetworkSecurity"
    - id: "nacl_rule_principle"
      question: "What principle is followed for Network ACL rules?"
      type: "single_choice"
      options: ["Least Privilege (Deny by Default)", "Explicit Allow Rules", "Permissive Rules", "Allow All Traffic", "Unknown"]
      help_text: "Least privilege principle minimizes attack surface by denying unnecessary traffic."
      related_branch: "AccessControl"
