      question: "How are egress rules configured?"
      type: "single_choice"
      options: ["Explicit Egress Rules", "Default Allow All", "Service-Specific Rules", "Unknown"]
      help_text: "Explicit egress rules control outbound traffic from subnet resources."
      related_branch: "Firewall"
