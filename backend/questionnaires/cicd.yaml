node_type: "Asset"
node_subtype: "CICD"
category: "DevOps Infrastructure"
description: "Continuous Integration/Continuous Deployment Pipeline"
required_branches:
  - "CICDSecurity"
  - "SupplyChain"
  - "SecretsManagement"
  - "AccessControl"
  - "Monitoring"

questionnaires:
  basic:
    - id: "cicd_platform_type"
      question: "What CI/CD platform is used?"
      type: "single_choice"
      options: ["Jenkins", "GitHub Actions", "GitLab CI", "AWS CodePipeline", "Azure DevOps", "Other", "Unknown"]
      help_text: "Different CI/CD platforms have varying security features and considerations."
      related_branch: "CICDSecurity"
    - id: "cicd_source_control_integration"
      question: "How is source control integrated securely?"
      type: "single_choice"
      options: ["Secure Git integration with signing", "Basic Git integration", "Insecure integration", "Unknown"]
      help_text: "Secure source control integration prevents code tampering."
      related_branch: "SupplyChain"
    - id: "cicd_secrets_management"
      question: "How are secrets managed in pipelines?"
      type: "single_choice"
      options: ["External secrets management", "Platform-native secret store", "Environment variables", "Hardcoded secrets", "Unknown"]
      help_text: "Proper secrets management prevents credential exposure in CI/CD."
      related_branch: "SecretsManagement"
    - id: "cicd_access_control"
      question: "What access controls are implemented?"
      type: "single_choice"
      options: ["Role-based access with MFA", "Basic role-based access", "Shared accounts", "No access controls", "Unknown"]
      help_text: "Access controls determine who can modify and execute pipelines."
      related_branch: "AccessControl"
    - id: "cicd_build_isolation"
      question: "How are builds isolated?"
      type: "single_choice"
      options: ["Containerized builds", "VM-based isolation", "Shared build environments", "Unknown"]
      help_text: "Build isolation prevents cross-contamination between different projects."
      related_branch: "CICDSecurity"

  advanced:
    - id: "cicd_code_scanning"
      question: "What code scanning is integrated into pipelines?"
      type: "multiple_choice"
      options: ["SAST", "DAST", "Dependency scanning", "Container scanning", "License compliance", "None"]
      help_text: "Code scanning detects security vulnerabilities early in development."
      related_branch: "VulnerabilityScanning"
    - id: "cicd_artifact_signing"
      question: "Are build artifacts signed?"
      type: "single_choice"
      options: ["Cryptographic signing with verification", "Basic artifact integrity", "No artifact signing", "Unknown"]
      help_text: "Artifact signing ensures integrity and authenticity of build outputs."
      related_branch: "SupplyChain"
    - id: "cicd_pipeline_as_code"
      question: "Are pipelines defined as code?"
      type: "single_choice"
      options: ["Version-controlled pipeline definitions", "GUI-configured pipelines", "Mixed approach", "Unknown"]
      help_text: "Pipeline as code enables version control and review of build processes."
      related_branch: "CICDSecurity"
    - id: "cicd_deployment_approvals"
      question: "What approval processes are implemented?"
      type: "single_choice"
      options: ["Multi-stage approvals with segregation", "Basic approvals", "Automated deployments", "Unknown"]
      help_text: "Approval processes ensure proper review before production deployments."
      related_branch: "AccessControl"
    - id: "cicd_environment_segregation"
      question: "How are deployment environments segregated?"
      type: "single_choice"
      options: ["Strict environment isolation", "Basic environment separation", "Shared environments", "Unknown"]
      help_text: "Environment segregation prevents accidental production deployments."
      related_branch: "CICDSecurity"
    - id: "cicd_vulnerability_gates"
      question: "Are vulnerability gates implemented?"
      type: "single_choice"
      options: ["Automated gates with severity thresholds", "Manual vulnerability review", "No vulnerability gates", "Unknown"]
      help_text: "Vulnerability gates prevent deployment of insecure code."
      related_branch: "VulnerabilityScanning"
    - id: "cicd_compliance_checks"
      question: "Are compliance checks automated in pipelines?"
      type: "single_choice"
      options: ["Comprehensive compliance automation", "Basic compliance checks", "Manual compliance", "Unknown"]
      help_text: "Automated compliance ensures adherence to regulatory requirements."
      related_branch: "Compliance"
    - id: "cicd_rollback_capabilities"
      question: "What rollback capabilities are implemented?"
      type: "single_choice"
      options: ["Automated rollback with verification", "Manual rollback procedures", "No rollback capabilities", "Unknown"]
      help_text: "Rollback capabilities enable quick recovery from failed deployments."
      related_branch: "IncidentResponse"
    - id: "cicd_testing_automation"
      question: "What security testing is automated?"
      type: "multiple_choice"
      options: ["Unit tests", "Integration tests", "Security tests", "Performance tests", "None"]
      help_text: "Automated testing ensures code quality and security before deployment."
      related_branch: "CICDSecurity"
    - id: "cicd_infrastructure_as_code"
      question: "Is infrastructure as code integrated?"
      type: "single_choice"
      options: ["IaC with security scanning", "Basic IaC integration", "No IaC", "Unknown"]
      help_text: "Infrastructure as code enables versioned and reviewable infrastructure changes."
      related_branch: "CICDSecurity"
    - id: "cicd_dependency_management"
