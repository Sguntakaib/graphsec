    - id: "cicd_deployment_verification"
      question: "How are deployments verified?"
      type: "single_choice"
      options: ["Automated deployment verification", "Manual verification", "No deployment verification", "Unknown"]
      help_text: "Deployment verification ensures successful and secure deployments."
