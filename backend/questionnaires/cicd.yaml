dependencies:
  cicd_secrets_external: "SecretsManager"
  cicd_container_scanning: "ContainerSecurity"
  cicd_monitoring_enabled: "Monitoring"

threat_intelligence:
  cve_count: 90
  recent_threats: ["Supply Chain Attacks", "Pipeline Injection", "Credential Theft"]
  attack_vectors: ["Malicious Dependencies", "Code Injection", "Privilege Escalation"]
  mitre_techniques: ["T1195", "T1190", "T1078", "T1543"]
  threat_actors: ["APT Groups", "Cybercriminals", "Insider Threats"]

risk_factors:
  hardcoded_secrets: 4.5
  no_code_scanning: 3.5
  insecure_dependencies: 3.0
  no_access_controls: 4.0
  shared_credentials: 4.5