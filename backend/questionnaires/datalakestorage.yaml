    question: "What data lake platform is used?"
    type: "single_choice"
    options:
      - "AWS S3 + Lake Formation"
      - "Azure Data Lake"
      - "Google Cloud Storage"
      - "Hadoop HDFS"
      - "Delta Lake"
      - "Snowflake"
      - "Custom Solution"
    help_text: "Different platforms have varying security and governance capabilities."
