node_type: "Asset"
node_subtype: "Docker"
category: "Container Infrastructure"
description: "Docker Container Runtime and Images"
required_branches:
  - "ContainerSecurity"
  - "ImageSecurity"
  - "RuntimeSecurity"
  - "Monitoring"
  - "Compliance"

questionnaires:
  basic:
    - id: "docker_image_source"
      question: "What is the source of Docker images used?"
      type: "single_choice"
      options: ["Official Images Only", "Verified Publishers", "Internal Registry", "Public Repositories", "Mixed Sources", "Unknown"]
      help_text: "Trusted image sources reduce the risk of malicious or vulnerable containers."
      related_branch: "ImageSecurity"
    - id: "docker_base_image_updates"
      question: "How frequently are base images updated?"
      type: "single_choice"
      options: ["Continuous Updates", "Weekly Updates", "Monthly Updates", "Ad-hoc Updates", "No Regular Updates", "Unknown"]
      help_text: "Regular base image updates ensure security patches are applied promptly."
      related_branch: "ImageSecurity"
    - id: "docker_container_privileges"
      question: "How are container privileges configured?"
      type: "single_choice"
      options: ["Non-root User Only", "Limited Privileges", "Standard Configuration", "Root User", "Unknown"]
      help_text: "Running containers with minimal privileges reduces potential attack impact."
      related_branch: "RuntimeSecurity"
    - id: "docker_network_security"
      question: "How is container network security implemented?"
      type: "single_choice"
      options: ["Custom Network Policies", "Bridge Networks", "Host Networking", "Default Settings", "Unknown"]
      help_text: "Proper network configuration isolates containers and controls traffic flow."
      related_branch: "ContainerSecurity"
    - id: "docker_secrets_management"
      question: "How are secrets managed in containers?"
      type: "single_choice"
      options: ["External Secret Management", "Docker Secrets", "Environment Variables", "Hardcoded Secrets", "Unknown"]
      help_text: "Proper secrets management prevents credential exposure in containers."
      related_branch: "ContainerSecurity"

