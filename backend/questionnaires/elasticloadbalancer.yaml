basic:
  - id: "elb_type"
    question: "What type of load balancer is deployed?"
    type: "single_choice"
    options:
      - "Application Load Balancer (ALB)"
      - "Network Load Balancer (NLB)"
      - "Gateway Load Balancer (GLB)"
      - "Classic Load Balancer"
      - "Third-party LB"
    help_text: "Different load balancer types have different security capabilities and attack surfaces."
    related_branch: "NetworkSecurity"
  
  - id: "elb_ssl_termination"
    question: "How is SSL/TLS termination configured?"
    type: "single_choice"
    options:
      - "Load Balancer Terminates SSL"
      - "End-to-End Encryption"
      - "Pass-through Mode"
      - "No SSL/TLS"
      - "Mixed Configuration"
    help_text: "SSL termination affects encryption, certificate management, and performance."
    related_branch: "Encryption"
  
  - id: "elb_health_checks"
    question: "Are health checks properly configured?"
    type: "single_choice"
    options:
      - "Comprehensive Health Checks"
      - "Basic HTTP Checks"
      - "TCP Checks Only"
      - "No Health Checks"
      - "Unknown"
    help_text: "Proper health checks prevent routing to unhealthy instances."
    related_branch: "Monitoring"
  
  - id: "elb_access_logs"
    question: "Are access logs enabled and monitored?"
    type: "boolean"
    help_text: "Access logs provide visibility into traffic patterns and potential attacks."
    related_branch: "Monitoring"
  
  - id: "elb_waf_integration"
    question: "Is WAF integrated with the load balancer?"
    type: "single_choice"
    options:
      - "AWS WAF v2"
      - "AWS WAF Classic"
      - "Third-party WAF"
      - "No WAF Protection"
      - "Unknown"
    help_text: "WAF integration provides application-layer attack protection."
    related_branch: "WAF"

advanced:
  - id: "elb_sticky_sessions"
    question: "How are sticky sessions configured?"
    type: "single_choice"
    options:
      - "Application-controlled"
      - "Duration-based"
      - "No sticky sessions"
      - "Unknown"
    help_text: "Sticky session configuration affects load distribution and security."
    related_branch: "NetworkSecurity"
  
  - id: "elb_cross_zone_balancing"
    question: "Is cross-zone load balancing enabled?"
    type: "boolean"
    help_text: "Cross-zone balancing affects availability and traffic distribution."
    related_branch: "NetworkSecurity"
  
  - id: "elb_connection_draining"
    question: "Is connection draining properly configured?"
    type: "single_choice"
    options:
      - "Graceful draining enabled"
      - "Basic timeout configured"
      - "No connection draining"
      - "Unknown"
    help_text: "Connection draining prevents service disruption during maintenance."
    related_branch: "NetworkSecurity"
  
  - id: "elb_security_policies"
    question: "What SSL/TLS security policies are enforced?"
    type: "single_choice"
    options:
      - "Modern security policy (TLS 1.2+)"
      - "Standard security policy"
      - "Legacy support enabled"
      - "No specific policy"
      - "Unknown"
    help_text: "Security policies determine which SSL/TLS versions and ciphers are allowed."
    related_branch: "Encryption"
  
  - id: "elb_ddos_protection"
    question: "What DDoS protection measures are in place?"
    type: "multiple_choice"
    options:
      - "AWS Shield Standard"
      - "AWS Shield Advanced"
      - "CloudFlare DDoS Protection"
      - "Rate limiting"
      - "No DDoS protection"
    help_text: "DDoS protection prevents service disruption from volumetric attacks."
    related_branch: "DDoSProtection"

expert:
  - id: "elb_multi_az_failover"
    question: "How is multi-AZ failover configured?"
    type: "single_choice"
    options:
      - "Automatic failover across multiple AZs"
      - "Manual failover process"
      - "Single AZ deployment"
      - "Unknown"
    help_text: "Multi-AZ deployment provides high availability and disaster recovery."
    related_branch: "NetworkSecurity"
  
  - id: "elb_target_health_monitoring"
    question: "What target health monitoring is implemented?"
    type: "multiple_choice"
    options:
      - "Custom health check endpoints"
      - "Application-level health checks"
      - "Deep health monitoring"
      - "Basic TCP/HTTP checks"
      - "No monitoring"
    help_text: "Comprehensive health monitoring ensures only healthy targets receive traffic."
    related_branch: "Monitoring"
  
  - id: "elb_routing_algorithms"
    question: "What advanced routing algorithms are used?"
    type: "multiple_choice"
    options:
      - "Least outstanding requests"
      - "Round robin"
      - "IP hash"
      - "Weighted routing"
      - "None/Default"
    help_text: "Advanced routing algorithms optimize performance and security."
    related_branch: "NetworkSecurity"
  
  - id: "elb_certificate_management"
    question: "How are SSL certificates managed and rotated?"
    type: "single_choice"
    options:
      - "Automated certificate management (ACM)"
      - "Manual certificate management"
      - "Third-party certificate management"
      - "No certificate rotation"
      - "Unknown"
    help_text: "Automated certificate management reduces security risks from expired certificates."
    related_branch: "Encryption"
  
  - id: "elb_compliance_standards"
    question: "Which compliance standards does the load balancer configuration meet?"
    type: "multiple_choice"
    options:
      - "PCI DSS"
      - "SOC 2"
      - "HIPAA"
      - "FedRamp"
      - "ISO 27001"
      - "None"
    help_text: "Compliance standards ensure load balancer meets regulatory requirements."
    related_branch: "Compliance"