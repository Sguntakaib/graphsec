node_type: "Asset"
node_subtype: "API" 
category: "Application Services"
description: "REST/GraphQL API Endpoint"
required_branches:
  - "ApiSecurity"
  - "Authentication"
  - "Authorization"
  - "RateLimiting"
  - "InputValidation"
  - "Monitoring"
  - "Encryption"

questionnaires:
  basic:
    - id: "api_type"
      question: "What type of API is this?"
      type: "single_choice"
      options: ["REST API", "GraphQL API", "gRPC API", "SOAP API", "WebSocket API", "Other", "Unknown"]
      option_descriptions:
        "REST API": "RESTful API using HTTP methods (GET, POST, PUT, DELETE) with JSON/XML data exchange - most common API type."
        "GraphQL API": "Query language API allowing clients to request specific data fields and relationships in a single request."
        "gRPC API": "High-performance RPC framework using Protocol Buffers for efficient binary communication."
        "SOAP API": "XML-based web service protocol with strict message structure and built-in error handling."
        "WebSocket API": "Real-time bidirectional communication protocol for live data streaming and interactive applications."
        "Other": "Custom or hybrid API implementation that doesn't fit standard categories."
        "Unknown": "API type is unclear or not documented."
      help_text: "API type determines appropriate security controls and vulnerability patterns."
      related_branch: "ApiSecurity"
    - id: "api_authentication_method"
      question: "What authentication method does the API use?"
      type: "single_choice"
      options: ["OAuth2/JWT", "API Keys", "Basic Authentication", "No Authentication", "Unknown"]
      option_descriptions:
        "OAuth2/JWT": "Modern token-based authentication using OAuth 2.0 or JSON Web Tokens with support for scopes and time-limited access."
        "API Keys": "Authentication using API keys - simple but requires secure key management and rotation practices."
        "Basic Authentication": "Username/password authentication sent with each request - less secure and harder to manage at scale."
        "No Authentication": "API endpoints are publicly accessible without authentication - high risk for data exposure."
        "Unknown": "API authentication method is unclear or not documented."
      help_text: "Strong API authentication prevents unauthorized access to API endpoints."
      related_branch: "Authentication"
    - id: "api_authorization_model"
      question: "How is API authorization implemented?"
      type: "single_choice"
      options: ["Role-based with scopes", "Simple role-based", "API key permissions", "No authorization", "Unknown"]
      option_descriptions:
        "Role-based with scopes": "Fine-grained authorization using roles and scopes to control access to specific API operations and data."
        "Simple role-based": "Basic role-based access control with broad permissions - may grant more access than necessary."
        "API key permissions": "Authorization based on API key permissions - simpler but less flexible than role-based systems."
        "No authorization": "All authenticated users have the same access level - no restriction on API operations."
        "Unknown": "API authorization implementation is unclear or not documented."
      help_text: "Proper authorization ensures API consumers can only access appropriate resources."
      related_branch: "Authorization"
    - id: "api_rate_limiting"
      question: "Is rate limiting implemented?"
      type: "single_choice"
      options: ["Per-user rate limiting", "Global rate limiting", "Basic throttling", "No rate limiting", "Unknown"]
      option_descriptions:
        "Per-user rate limiting": "Individual rate limits for each user or API key, providing fair usage and preventing individual users from overwhelming the API."
        "Global rate limiting": "System-wide rate limiting that applies to all API consumers collectively - protects the service but may affect legitimate users."
        "Basic throttling": "Simple rate limiting with minimal configuration - may not adequately protect against sophisticated abuse."
        "No rate limiting": "No restrictions on API request frequency - vulnerable to denial-of-service attacks and abuse."
        "Unknown": "API rate limiting implementation is unclear or not documented."
      help_text: "Rate limiting prevents API abuse and ensures service availability."
      related_branch: "RateLimiting"
    - id: "api_database_access"
      question: "Does this API connect to a database?"
      type: "boolean"
      help_text: "Database connections require proper security controls to prevent data exposure."
      related_branch: "Database"
      conditional_trigger: "Database"
    - id: "api_web_interface_exposure"
      question: "Does this API expose a web interface or webpage?"
      type: "single_choice"
      options: ["Yes - Full web application interface", "Yes - Administrative/management interface", "Yes - API documentation/explorer", "No - API only", "Unknown"]
      option_descriptions:
        "Yes - Full web application interface": "API serves a complete web application with user interfaces, forms, and interactive elements."
        "Yes - Administrative/management interface": "API provides admin panels or management interfaces for configuration and monitoring."
        "Yes - API documentation/explorer": "API serves documentation pages, Swagger UI, or interactive API explorers."
        "No - API only": "API provides only programmatic endpoints without any web interface components."
        "Unknown": "Web interface exposure is unclear or not documented."
      help_text: "APIs with web interfaces require additional web security considerations beyond API-specific protections."
      related_branch: "WebSecurity"
      conditional_trigger: "WebApp"
    - id: "api_input_validation"
      question: "How is API input validation implemented?"
      type: "single_choice"
      options: ["Schema validation + sanitization", "Basic validation", "Client-side only", "No validation", "Unknown"]
      option_descriptions:
        "Schema validation + sanitization": "Comprehensive validation using JSON/XML schemas plus input sanitization to prevent injection attacks and ensure data integrity."
        "Basic validation": "Simple validation checks for required fields and basic format validation, but may miss sophisticated attack vectors."
        "Client-side only": "Validation performed only by API clients - easily bypassed by attackers and provides no security protection."
        "No validation": "No input validation is performed - highly vulnerable to injection attacks and malformed data."
        "Unknown": "API input validation approach is unclear or not documented."
      help_text: "Input validation prevents injection attacks and ensures data integrity."
      related_branch: "InputValidation"
    - id: "api_https_enforcement"
      question: "Is HTTPS enforced for all API calls?"
      type: "single_choice"
      options: ["HTTPS only", "HTTPS preferred", "Mixed HTTP/HTTPS", "HTTP only", "Unknown"]
      option_descriptions:
        "HTTPS only": "All API endpoints require HTTPS with secure TLS configuration, HTTP requests are automatically redirected or rejected for maximum security."
        "HTTPS preferred": "HTTPS is the default but HTTP may be accepted in some cases - provides encryption for most traffic but potential security gaps."
        "Mixed HTTP/HTTPS": "Some API endpoints use HTTPS while others use HTTP - inconsistent protection leaves sensitive data vulnerable during transmission."
        "HTTP only": "All API communication is unencrypted - highly vulnerable to man-in-the-middle attacks and data interception."
        "Unknown": "API HTTPS enforcement policy is unclear or not documented."
      help_text: "HTTPS encryption protects API data in transit."
      related_branch: "Encryption"
    - id: "api_error_handling"
      question: "How are API errors handled?"
      type: "single_choice"
      options: ["Secure error responses", "Generic error messages", "Detailed error info", "No error handling", "Unknown"]
      option_descriptions:
        "Secure error responses": "Error messages provide helpful information to legitimate users while avoiding disclosure of sensitive system details or internal structure."
        "Generic error messages": "Simple, non-specific error messages that don't reveal system details but may be less helpful for debugging legitimate issues."
        "Detailed error info": "Comprehensive error information including system details, file paths, or database errors - helpful for development but reveals sensitive information."
        "No error handling": "API doesn't handle errors gracefully, potentially exposing stack traces, system information, or causing service disruption."
        "Unknown": "API error handling approach is unclear or not documented."
      help_text: "Proper error handling prevents information disclosure through API responses."
      related_branch: "ErrorHandling"
    - id: "api_logging_monitoring"
      question: "What API logging and monitoring is in place?"
      type: "single_choice"
      options: ["Comprehensive API logging", "Basic request logging", "Minimal logging", "No logging", "Unknown"]
      option_descriptions:
        "Comprehensive API logging": "Complete audit trail including requests, responses, authentication events, errors, and security events with real-time monitoring and alerting."
        "Basic request logging": "Logs API requests and basic response information, but may miss security events, detailed error information, or real-time monitoring."
        "Minimal logging": "Limited logging of basic API activity - insufficient for security monitoring, troubleshooting, or forensic analysis."
        "No logging": "No API activity logging - impossible to detect security incidents, troubleshoot issues, or maintain audit trails."
        "Unknown": "API logging and monitoring configuration is unclear or not documented."
      help_text: "API logging enables security monitoring and forensic analysis."
      related_branch: "Monitoring"
    - id: "api_cors_configuration"
      question: "How is CORS configured?"
      type: "single_choice"
      options: ["Restrictive CORS policy", "Standard CORS", "Permissive CORS", "No CORS policy", "Unknown"]
      option_descriptions:
        "Restrictive CORS policy": "CORS configured with specific allowed origins, methods, and headers - provides strong protection against cross-origin attacks."
        "Standard CORS": "Moderate CORS policy that balances security with functionality - allows common cross-origin patterns with some restrictions."
        "Permissive CORS": "Loose CORS policy allowing broad cross-origin access - convenient but increases security risk from unauthorized domains."
        "No CORS policy": "CORS not configured or disabled - may block legitimate cross-origin requests or allow unrestricted access."
        "Unknown": "CORS configuration is unclear or not documented."
      help_text: "Proper CORS configuration prevents unauthorized cross-origin API access."
      related_branch: "ApiSecurity"
    - id: "api_gateway_implementation"
      question: "Is an API gateway used?"
      type: "single_choice"
      options: ["Full-featured API gateway", "Basic gateway", "Reverse proxy", "No gateway", "Unknown"]
      option_descriptions:
        "Full-featured API gateway": "Complete API gateway with authentication, authorization, rate limiting, monitoring, and policy enforcement."
        "Basic gateway": "Simple API gateway providing basic routing and load balancing with minimal security features."
        "Reverse proxy": "Basic reverse proxy handling traffic routing but limited API-specific security features."
        "No gateway": "Direct API access without centralized gateway protection - increases security management complexity."
        "Unknown": "API gateway implementation is unclear or not documented."
      help_text: "API gateways provide centralized security, monitoring, and management."
      related_branch: "ApiSecurity"
    - id: "api_data_sanitization"
      question: "How is sensitive data sanitized in API responses?"
      type: "single_choice"
      options: ["Automatic PII redaction", "Field-level filtering", "Basic sanitization", "No sanitization", "Unknown"]
      option_descriptions:
        "Automatic PII redaction": "Automated detection and redaction of personally identifiable information in API responses."
        "Field-level filtering": "Manual configuration to exclude or mask specific sensitive fields in API responses."
        "Basic sanitization": "Simple data cleaning that removes obvious sensitive information but may miss complex cases."
        "No sanitization": "No filtering of sensitive data in API responses - high risk of data exposure."
        "Unknown": "Data sanitization approach is unclear or not documented."
      help_text: "Data sanitization prevents sensitive information exposure through API responses."
      related_branch: "DataClassification"
    - id: "api_pagination_security"
      question: "How is API pagination secured?"
      type: "single_choice"
      options: ["Secure pagination with limits", "Basic pagination", "No pagination limits", "No pagination", "Unknown"]
      option_descriptions:
        "Secure pagination with limits": "Pagination with maximum page size limits, resource consumption controls, and proper offset validation."
        "Basic pagination": "Simple pagination implementation with basic page controls but limited security protections."
        "No pagination limits": "Pagination without size limits - vulnerable to resource exhaustion attacks."
        "No pagination": "No pagination support - may expose large datasets or cause performance issues."
        "Unknown": "Pagination security implementation is unclear or not documented."
      help_text: "Secure pagination prevents resource exhaustion and data exposure attacks."
      related_branch: "ApiSecurity"
    - id: "api_documentation_security"
      question: "How is API documentation secured?"
      type: "single_choice"
      options: ["Authenticated access to docs", "Public but sanitized docs", "Public detailed docs", "No documentation", "Unknown"]
      option_descriptions:
        "Authenticated access to docs": "API documentation requires authentication and provides appropriate detail based on user permissions."
        "Public but sanitized docs": "Publicly accessible documentation with sensitive implementation details removed."
        "Public detailed docs": "Comprehensive public documentation including internal details - helpful but potential security risk."
        "No documentation": "No API documentation available - hinders proper usage and security review."
        "Unknown": "API documentation security approach is unclear or not documented."
      help_text: "Secure API documentation prevents information disclosure while enabling proper usage."
      related_branch: "ApiSecurity"

