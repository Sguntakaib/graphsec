      type: "single_choice"
      options: ["Private registry with scanning", "Private registry basic", "Public registry usage", "Unknown"]
      help_text: "Secure registries prevent deployment of malicious or vulnerable images."
      related_branch: "ContainerSecurity"
    - id: "k8s_etcd_security"
      question: "How is etcd secured?"
      type: "single_choice"
      options: ["etcd with encryption and backup", "Basic etcd security", "Default etcd configuration", "Unknown"]
      help_text: "etcd security is critical as it stores all cluster data and secrets."
      related_branch: "Encryption"
    - id: "k8s_api_server_security"
      question: "How is the API server secured?"
      type: "single_choice"
      options: ["API server hardened with authentication", "Basic API security", "Default API configuration", "Unknown"]
      help_text: "API server security controls access to the entire Kubernetes cluster."
      related_branch: "AccessControl"
    - id: "k8s_node_security"
      question: "How are worker nodes secured?"
      type: "single_choice"
      options: ["Hardened nodes with CIS compliance", "Basic node security", "Default node configuration", "Unknown"]
      help_text: "Node security prevents compromise of the underlying infrastructure."
      related_branch: "OSHardening"
    - id: "k8s_workload_identity"
      question: "Is workload identity implemented?"
      type: "single_choice"
      options: ["Workload identity with service accounts", "Basic service accounts", "No workload identity", "Unknown"]
      help_text: "Workload identity provides secure identity for applications running in pods."
      related_branch: "AccessControl"

