dependencies:
  k8s_logging_enabled: "Monitoring"
  k8s_backup_configured: "Backup"
  k8s_secrets_external: "SecretsManager"

threat_intelligence:
  cve_count: 120
  recent_threats: ["Container Escape", "Privilege Escalation", "Supply Chain Attacks"]
  attack_vectors: ["Malicious Images", "Cluster Misconfiguration", "API Server Attacks"]
  mitre_techniques: ["T1610", "T1611", "T1525", "T1055"]
  threat_actors: ["APT Groups", "Cybercriminals", "Insider Threats"]

risk_factors:
  privileged_containers: 4.0
  no_network_policies: 3.5
  weak_rbac: 3.0
  unscanned_images: 3.5
  default_configuration: 2.5