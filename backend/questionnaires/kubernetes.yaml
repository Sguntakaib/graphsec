      type: "single_choice"
      options: ["Automated compliance scanning", "Manual compliance checks", "No compliance scanning", "Unknown"]
      help_text: "Compliance scanning ensures cluster meets regulatory requirements."
      related_branch: "Compliance"
    - id: "k8s_image_registry_security"
