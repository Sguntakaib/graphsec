node_type: "Asset"
node_subtype: "Kubernetes"
category: "Container Infrastructure"
description: "Kubernetes Container Orchestration Platform"
required_branches:
  - "ContainerSecurity"
  - "ContainerOrchestration"
  - "AccessControl"
  - "NetworkSecurity"
  - "Monitoring"

questionnaires:
  basic:
    - id: "k8s_cluster_version"
      question: "What Kubernetes version is running?"
      type: "single_choice"
      options: ["Latest stable (1.28+)", "Recent version (1.25-1.27)", "Older version (1.20-1.24)", "Legacy version (<1.20)", "Unknown"]
      help_text: "Keeping Kubernetes updated is critical for security patches and features."
      related_branch: "ContainerOrchestration"
    - id: "k8s_rbac_enabled"
      question: "Is Role-Based Access Control (RBAC) enabled?"
      type: "single_choice"
      options: ["RBAC fully configured", "RBAC partially configured", "RBAC enabled but default", "RBAC disabled", "Unknown"]
      help_text: "RBAC controls who can access what resources in the Kubernetes cluster."
      related_branch: "AccessControl"
    - id: "k8s_network_policies"
      question: "Are network policies implemented?"
      type: "single_choice"
      options: ["Comprehensive network policies", "Basic network policies", "Default network access", "Unknown"]
      help_text: "Network policies control pod-to-pod communication and external access."
      related_branch: "NetworkSecurity"
    - id: "k8s_pod_security_standards"
      question: "Are Pod Security Standards enforced?"
      type: "single_choice"
      options: ["Restricted security standards", "Baseline security standards", "Privileged mode allowed", "No pod security", "Unknown"]
      help_text: "Pod Security Standards prevent insecure pod configurations."
      related_branch: "ContainerSecurity"
    - id: "k8s_secrets_management"
      question: "How are secrets managed in the cluster?"
      type: "single_choice"
      options: ["External secret management", "Kubernetes secrets with encryption", "Basic Kubernetes secrets", "Secrets in ConfigMaps", "Unknown"]
      help_text: "Proper secret management prevents credential exposure in containers."
      related_branch: "SecretsManagement"

  advanced:
    - id: "k8s_admission_controllers"
      question: "What admission controllers are configured?"
      type: "multiple_choice"
      options: ["PodSecurityPolicy", "OPA Gatekeeper", "Falco", "Custom admission controllers", "Default controllers only", "None"]
      help_text: "Admission controllers enforce security policies when objects are created or modified."
      related_branch: "ContainerSecurity"
    - id: "k8s_image_scanning"
      question: "Is container image scanning implemented?"
      type: "single_choice"
      options: ["Automated scanning with blocking", "Automated scanning with alerts", "Manual scanning", "No image scanning", "Unknown"]
      help_text: "Image scanning detects vulnerabilities in container images before deployment."
      related_branch: "VulnerabilityScanning"
    - id: "k8s_runtime_security"
      question: "What runtime security monitoring is deployed?"
      type: "single_choice"
      options: ["Comprehensive runtime security", "Basic runtime monitoring", "No runtime security", "Unknown"]
      help_text: "Runtime security monitors container behavior for malicious activities."
      related_branch: "ContainerSecurity"
    - id: "k8s_service_mesh"
      question: "Is a service mesh implemented?"
      type: "single_choice"
      options: ["Service mesh with mTLS", "Basic service mesh", "No service mesh", "Unknown"]
      help_text: "Service mesh provides secure service-to-service communication."
      related_branch: "NetworkSecurity"
    - id: "k8s_logging_monitoring"
      question: "What logging and monitoring is configured?"
      type: "multiple_choice"
      options: ["Centralized logging", "Metrics collection", "Alerting", "Distributed tracing", "None"]
      help_text: "Comprehensive monitoring provides visibility into cluster security events."
      related_branch: "Monitoring"
    - id: "k8s_backup_disaster_recovery"
      question: "Are backup and disaster recovery configured?"
      type: "single_choice"
      options: ["Automated backup with tested recovery", "Basic backup configuration", "No backup strategy", "Unknown"]
      help_text: "Backup and DR ensure cluster availability during disasters."
      related_branch: "Backup"
    - id: "k8s_cluster_hardening"
      question: "Is the cluster hardened according to security benchmarks?"
      type: "single_choice"
      options: ["CIS Kubernetes Benchmark compliant", "Partially hardened", "Default configuration", "Unknown"]
      help_text: "Cluster hardening follows security best practices and benchmarks."
      related_branch: "ContainerOrchestration"
    - id: "k8s_certificate_management"
      question: "How are certificates managed in the cluster?"
      type: "single_choice"
      options: ["Automated certificate management", "Manual certificate handling", "Default certificates", "Unknown"]
      help_text: "Proper certificate management ensures secure cluster communication."
      related_branch: "Encryption"
    - id: "k8s_resource_quotas"
      question: "Are resource quotas and limits configured?"
      type: "single_choice"
      options: ["Comprehensive resource controls", "Basic quotas configured", "No resource limits", "Unknown"]
      help_text: "Resource quotas prevent resource exhaustion attacks."
      related_branch: "ContainerSecurity"
    - id: "k8s_ingress_security"
      question: "How is ingress traffic secured?"
      type: "single_choice"
      options: ["WAF-protected ingress with TLS", "Basic ingress with TLS", "Unprotected ingress", "Unknown"]
      help_text: "Secure ingress protects applications from external threats."
      related_branch: "NetworkSecurity"
    - id: "k8s_multi_tenancy"
      question: "How is multi-tenancy implemented?"
      type: "single_choice"
      options: ["Strong multi-tenant isolation", "Basic namespace separation", "Single tenant cluster", "Unknown"]
      help_text: "Multi-tenancy requires careful isolation between different users or applications."
      related_branch: "AccessControl"
    - id: "k8s_compliance_scanning"
