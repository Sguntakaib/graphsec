questionnaires:
  basic:
    - id: "database_authentication"
      question: "How is database authentication configured?"
      type: "single_choice"
      options: ["Strong authentication with MFA", "Username/password with complexity", "Basic authentication", "No authentication", "Unknown"]
      option_descriptions:
        "Strong authentication with MFA": "Multi-factor authentication with strong password policies, account lockout, and integration with enterprise identity management systems."
        "Username/password with complexity": "Standard username/password authentication with complexity requirements and password rotation policies."
        "Basic authentication": "Simple username/password authentication with minimal security controls - vulnerable to credential attacks."
        "No authentication": "Database allows anonymous or unrestricted access - extremely vulnerable to unauthorized data access."
        "Unknown": "Database authentication configuration is unclear or not documented."
      help_text: "Strong database authentication prevents unauthorized data access."
      related_branch: "AccessControl"
    - id: "database_encryption_at_rest"
      question: "Is data encrypted at rest?"
      type: "single_choice"
      options: ["Transparent Data Encryption (TDE)", "File-level encryption", "Disk encryption", "No encryption", "Unknown"]
      option_descriptions:
        "Transparent Data Encryption (TDE)": "Database-level encryption that automatically encrypts data as it's written to disk and decrypts when read, providing comprehensive protection."
        "File-level encryption": "Individual database files are encrypted, but may not cover all data storage locations like logs and temporary files."
        "Disk encryption": "Full disk encryption protects against physical theft but data is unencrypted when the database is running."
        "No encryption": "Database files are stored in plaintext - highly vulnerable if storage media is compromised."
        "Unknown": "Data encryption at rest status is unclear or not documented."
      help_text: "Encryption at rest protects stored data from unauthorized access."
      related_branch: "Encryption"
    - id: "database_encryption_in_transit"
      question: "Is data encrypted in transit?"
      type: "single_choice"
      options: ["SSL/TLS enforced", "SSL/TLS available", "Unencrypted connections", "Unknown"]
      help_text: "Encryption in transit protects data during transmission."
      related_branch: "Encryption"
