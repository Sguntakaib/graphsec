questionnaires:
  basic:
    - id: "lb_type"
      question: "What type of load balancer is deployed?"
      type: "single_choice"
      options: ["Application Load Balancer (ALB)", "Network Load Balancer (NLB)", "Classic Load Balancer", "Third-party load balancer", "Unknown"]
      help_text: "Different load balancer types provide varying security features and capabilities."
      related_branch: "LoadBalancer"
    - id: "lb_internet_facing"
      question: "Is the load balancer internet-facing or internal?"
      type: "single_choice"
      options: ["Internal only", "Internet-facing with restrictions", "Fully public", "Unknown"]
      help_text: "Internet-facing load balancers increase attack surface and require additional security."
      related_branch: "NetworkSecurity"
    - id: "lb_ssl_termination"
      question: "How is SSL/TLS termination configured?"
      type: "single_choice"
      options: ["SSL termination with strong ciphers", "Basic SSL termination", "No SSL termination", "Unknown"]
      help_text: "SSL termination provides encryption for client connections."
