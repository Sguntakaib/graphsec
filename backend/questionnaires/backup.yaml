questionnaires:
  basic:
    - id: "backup_strategy"
      question: "What backup strategy is implemented?"
      type: "single_choice"
      options: ["Comprehensive Multi-Tier Backup", "Regular Scheduled Backups", "Ad-hoc Backups", "No Backup Strategy", "Unknown"]
      option_descriptions:
        "Comprehensive Multi-Tier Backup": "Multi-layered backup approach with different backup types (full, incremental, differential), multiple storage tiers, and automated lifecycle management for comprehensive data protection."
        "Regular Scheduled Backups": "Consistent scheduled backup process with defined frequency and retention, but may lack advanced features like intelligent tiering or lifecycle management."
        "Ad-hoc Backups": "Irregular, manual backup processes without consistent scheduling - prone to human error and gaps in data protection coverage."
        "No Backup Strategy": "No systematic backup approach in place - extremely high risk of permanent data loss during system failures or disasters."
        "Unknown": "Backup strategy implementation is unclear or not documented."
      help_text: "A comprehensive backup strategy ensures data protection across all critical systems."
      related_branch: "Backup"
    - id: "backup_frequency"
      question: "What is the backup frequency for critical data?"
      type: "single_choice"
      options: ["Continuous/Real-time", "Daily", "Weekly", "Monthly", "Irregular", "Unknown"]
      option_descriptions:
        "Continuous/Real-time": "Continuous data replication or real-time backup capturing changes as they occur - provides minimal data loss potential but requires robust infrastructure."
        "Daily": "Daily backup schedule providing good balance between data protection and resource utilization - acceptable for most business-critical applications."
        "Weekly": "Weekly backup frequency suitable for less critical data with longer acceptable recovery point objectives - lower resource usage but higher potential data loss."
        "Monthly": "Monthly backup schedule appropriate only for archival or rarely changing data - significant risk of data loss for active systems."
        "Irregular": "Inconsistent backup frequency without defined schedule - unpredictable data protection coverage and high risk during gaps."
        "Unknown": "Backup frequency schedule is unclear or not documented."
      help_text: "Backup frequency determines the maximum acceptable data loss in case of failure."
      related_branch: "Backup"
    - id: "backup_encryption"
      question: "How are backups encrypted?"
      type: "single_choice"
      options: ["Customer Managed KMS Keys", "AWS Managed Keys", "Default Encryption", "No Encryption", "Unknown"]
      option_descriptions:
        "Customer Managed KMS Keys": "Customer-controlled encryption keys with full key lifecycle management, rotation policies, and audit trails - provides maximum security and control over backup encryption."
        "AWS Managed Keys": "Cloud provider managed encryption keys with automatic rotation and management - good security with reduced administrative overhead."
        "Default Encryption": "Basic encryption using platform default settings - provides encryption but may lack advanced key management features or customization options."
        "No Encryption": "Backup data stored without encryption - highly vulnerable to unauthorized access if storage media is compromised or stolen."
        "Unknown": "Backup encryption implementation is unclear or not documented."
      help_text: "Encryption protects backup data from unauthorized access during storage and transit."
      related_branch: "Encryption"
    - id: "backup_retention"
      question: "What is the backup retention policy?"
      type: "single_choice"
      options: ["Long-term (>1 year)", "Medium-term (3-12 months)", "Short-term (<3 months)", "No Retention Policy", "Unknown"]
      option_descriptions:
        "Long-term (>1 year)": "Extended backup retention supporting long-term recovery requirements, regulatory compliance, and historical data analysis - higher storage costs but comprehensive coverage."
        "Medium-term (3-12 months)": "Moderate retention period balancing recovery capabilities with storage costs - suitable for most business requirements and basic compliance needs."
        "Short-term (<3 months)": "Minimal retention period focused on immediate recovery needs - lower storage costs but limited ability to recover from older incidents or meet compliance requirements."
        "No Retention Policy": "No defined backup retention strategy - unpredictable backup availability and potential compliance violations."
        "Unknown": "Backup retention policy is unclear or not documented."
      help_text: "Retention policies balance storage costs with recovery requirements and compliance needs."
      related_branch: "Backup"
    - id: "backup_testing"
      question: "How frequently are backup restores tested?"
      type: "single_choice"
      options: ["Monthly", "Quarterly", "Annually", "Never Tested", "Unknown"]
      help_text: "Regular restore testing ensures backups are viable when needed for recovery."
      related_branch: "DataIntegrity"

