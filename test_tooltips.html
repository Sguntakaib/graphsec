<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionnaire Tooltips Test</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@radix-ui/react-tooltip@1.0.7/dist/index.umd.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #1f2937;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { Tooltip, TooltipContent, TooltipProvider, TooltipTrigger } = RadixTooltip;
        const QuestionnaireDemo = () => {
            const [selectedValue, setSelectedValue] = useState("");
            const [questionnaire, setQuestionnaire] = useState(null);
            
            // Load real questionnaire data from API
            useEffect(() => {
                const loadQuestionnaire = async () => {
                    try {
                        const response = await fetch('http://localhost:8001/api/questionnaires/WebApp?level=basic');
                        const data = await response.json();
                        if (data.prompts && data.prompts.length > 0) {
                            setQuestionnaire(data.prompts[0]); // Use first question as example
                        }
                    } catch (error) {
                        console.error('Failed to load questionnaire:', error);
                        // Fallback to mock data
                        setQuestionnaire({
                            id: "webapp_session_management",
                            question: "How are user sessions managed?",
                            type: "single_choice",
                            options: ["Secure session management", "Standard sessions", "Basic sessions", "No session management", "Unknown"],
                            option_descriptions: {
                                "Secure session management": "Implements HTTPS-only cookies, secure session IDs, session rotation, timeout controls, and protection against session hijacking and fixation attacks.",
                                "Standard sessions": "Basic session handling with standard security practices like secure cookies and reasonable timeouts, but may lack advanced protections.",
                                "Basic sessions": "Simple session implementation with minimal security features - vulnerable to common session-based attacks.",
                                "No session management": "Application does not maintain user sessions, requiring re-authentication for each request or operating statelessly.",
                                "Unknown": "Session management implementation is unclear or not documented."
                            },
                            help_text: "Secure session management prevents session hijacking and fixation attacks."
                        });
                    }
                };
                
                loadQuestionnaire();
            }, []);

            const HelpCircleIcon = () => (
                <svg className="h-4 w-4 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                    <path d="M12 17h.01"></path>
                </svg>
            );

            const renderPromptInput = (prompt) => {
                return (
                    <div className="space-y-2">
                        {prompt.options?.map((option, index) => {
                            const optionDescription = prompt.option_descriptions?.[option];
                            const optionElement = (
                                <label 
                                    key={index}
                                    className="flex items-center space-x-3 p-3 border border-gray-600 rounded-lg hover:bg-gray-700 cursor-pointer transition-colors"
                                >
                                    <input
                                        type="radio"
                                        name={prompt.id}
                                        value={option}
                                        checked={selectedValue === option}
                                        onChange={(e) => setSelectedValue(e.target.value)}
                                        className="text-blue-600 focus:ring-blue-500"
                                    />
                                    <span className="text-white flex-grow">{option}</span>
                                    {optionDescription && (
                                        <HelpCircleIcon />
                                    )}
                                </label>
                            );

                            if (optionDescription) {
                                return (
                                    <Tooltip key={index}>
                                        <TooltipTrigger asChild>
                                            {optionElement}
                                        </TooltipTrigger>
                                        <TooltipContent 
                                            side="right" 
                                            className="max-w-xs bg-gray-900 border border-gray-700 text-gray-100 p-3 rounded-lg shadow-lg z-50"
                                            sideOffset={10}
                                        >
                                            <p className="text-sm">{optionDescription}</p>
                                        </TooltipContent>
                                    </Tooltip>
                                );
                            }
                            
                            return optionElement;
                        })}
                    </div>
                );
            };

            return (
                <TooltipProvider>
                    <div className="min-h-screen bg-gray-900 p-8">
                        <div className="max-w-2xl mx-auto">
                            <div className="bg-gray-800 rounded-lg shadow-2xl p-6">
                                {/* Header */}
                                <div className="border-b border-gray-700 pb-4 mb-6">
                                    <div className="flex items-center space-x-3">
                                        <svg className="h-6 w-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                                        </svg>
                                        <h2 className="text-xl font-bold text-white">Security Configuration</h2>
                                    </div>
                                    <div className="text-sm text-gray-300 mt-2">
                                        Configuring: <span className="font-semibold text-blue-400">WebApp</span>
                                    </div>
                                </div>

                                {/* Question */}
                                <div className="mb-6">
                                    <h3 className="text-lg font-semibold text-white mb-2">
                                        {mockPrompt.question}
                                    </h3>
                                    
                                    {mockPrompt.help_text && (
                                        <div className="flex items-start space-x-2 p-3 bg-blue-900/20 border border-blue-700/30 rounded-lg mb-4">
                                            <svg className="h-5 w-5 text-blue-400 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <circle cx="12" cy="12" r="10"></circle>
                                                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                                                <path d="M12 17h.01"></path>
                                            </svg>
                                            <p className="text-sm text-blue-200">{mockPrompt.help_text}</p>
                                        </div>
                                    )}
                                </div>

                                {/* Options with Tooltips */}
                                <div className="mb-6">
                                    {renderPromptInput(mockPrompt)}
                                </div>

                                {/* Instructions */}
                                <div className="mt-6 p-4 bg-gray-900/50 border border-gray-600 rounded-lg">
                                    <h4 className="font-semibold text-white mb-2">✨ Tooltip Feature Demo</h4>
                                    <p className="text-sm text-gray-300">
                                        Hover over the question mark icons (🤔) next to each option to see detailed explanations of what each security configuration means.
                                    </p>
                                </div>

                                {selectedValue && (
                                    <div className="mt-4 p-3 bg-green-900/20 border border-green-700/30 rounded-lg">
                                        <p className="text-sm text-green-200">
                                            Selected: <strong>{selectedValue}</strong>
                                        </p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </TooltipProvider>
            );
        };

        ReactDOM.render(<QuestionnaireDemo />, document.getElementById('root'));
    </script>
</body>
</html>
